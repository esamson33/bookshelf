<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookshelf</title>
<link rel="icon" href="/favicon.ico">
<link rel="icon" href="/static/favicon-16.png" type="image/png" sizes="16x16">
<link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="/static/favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/static/site.webmanifest">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div class="brand">📚 Bookshelf<span class="count" id="count"></span></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search titles and summaries…" autocomplete="off">
      <button class="clear" id="clear" title="Clear">×</button>
    </div>
    <button class="mode" id="modeToggle" type="button">
      <span class="label">Manage</span><span class="pill" id="modePill"></span>
    </button>
  </header>

  <main>
    <aside id="sidebar"><div class="empty">Loading…</div></aside>
    <div class="splitter" id="splitter" title="Drag to resize"></div>
    <section class="viewer">
      <iframe id="pdf" title="PDF reader" style="display:none"></iframe>
      <div class="placeholder" id="placeholder">
        <div class="big">📖</div>
        <div>Select a book on the left to start reading.</div>
      </div>
    </section>
    <section class="manage" id="manage"></section>
  </main>

<script src="/static/bus.js"></script>
<script src="/static/aistatus.js"></script>
<script src="/static/app.js"></script>
<script src="/static/manage.js"></script>
</body>
</html>
